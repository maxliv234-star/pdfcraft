name: PdfCraft RU - Windows x64

on:
  push:
    branches:
      - feature/ru-edition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdfcraft-ru-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Compile PdfCraft RU
        run: cargo build --release --locked -p pdfcraft

      - name: Package standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/pdfcraft.exe dist/PdfCraft-RU.exe
          (Get-FileHash dist/PdfCraft-RU.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PdfCraft-RU-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
