name: PdfCraft RU - automatic Rust formatting

on:
  push:
    branches:
      - feature/ru-ui-polish-and-releases
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ru-autofmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'maxliv234-star/pdfcraft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply consistent Rust formatting
        run: cargo fmt --all
      - name: Commit formatting-only adjustments
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style: apply rustfmt to PdfCraft RU changes"
            git push origin HEAD:feature/ru-ui-polish-and-releases
          fi
