name: PdfCraft RU - draft Windows and macOS release

# Publish a tested ru-v* tag to prepare a draft. Publishing stays a manual decision.
on:
  push:
    tags:
      - 'ru-v*'

permissions:
  contents: read

concurrency:
  group: ru-draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'maxliv234-star/pdfcraft'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ru-release-windows
      - name: Test PDF interface library
        run: cargo test --locked -p pdfcraft-ui-egui --lib
      - name: Compile Windows desktop application
        run: cargo build --release --locked -p pdfcraft
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item target/release/pdfcraft.exe release-assets/PdfCraft-RU.exe
          Compress-Archive -Path release-assets/PdfCraft-RU.exe -DestinationPath release-assets/PdfCraft-RU-Windows-x64.zip -Force
          Remove-Item release-assets/PdfCraft-RU.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ru-windows-package
          path: release-assets/*.zip
          if-no-files-found: error

  macos:
    if: github.repository == 'maxliv234-star/pdfcraft'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      MACOS_SIGN_IDENTITY: '-'
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ru-release-macos
      - name: Package Apple Silicon DMG
        run: bash packaging/macos/package.sh --arch aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: ru-macos-package
          path: dist/release/*-macos-aarch64.dmg
          if-no-files-found: error

  draft-release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ru-*-package
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum ./*.zip ./*.dmg > SHA256SUMS.txt
      - name: Create draft with both installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" ./release-assets/* \
            --verify-tag --draft --title "PdfCraft RU $TAG_NAME" \
            --notes "Windows x64 ZIP and macOS Apple Silicon DMG. macOS build is ad-hoc signed and not notarized; approve Gatekeeper only if you trust this fork. Draft release: test on both platforms before publishing."
